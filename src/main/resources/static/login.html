<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Patient Follow-Up Login</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <h1>Patient Follow-Up</h1>
        <h2>Login</h2>

        <form method="post" action="/login">

            <label for="username">Username:</label>
            <input
                    type="text"
                    id="username"
                    name="username"
                    required
            >

            <label for="password">Password:</label>
            <input
                    type="password"
                    id="password"
                    name="password"
                    required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

</body>

</html>
